title: Certutil Writes an Executable or Script Output File
id: bb6be043-7b51-43ab-b3ce-ab4c483639cd
status: experimental
description: >-
  Detects certutil creating an executable or script output extension. This is a
  supporting high-confidence file tier and should be correlated with a certutil
  decode process event because file telemetry lacks the command switch.
references:
  - https://attack.mitre.org/techniques/T1140/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1140
logsource:
  category: file_event
  product: windows
  service: sysmon
detection:
  selection:
    Image|endswith: '\certutil.exe'
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.ps1'
      - '.bat'
      - '.cmd'
      - '.vbs'
      - '.js'
      - '.hta'
  condition: selection
falsepositives:
  - Software deployment systems using certutil to reconstruct benign scripts or binaries
  - Administrators intentionally decoding approved executable or script content during troubleshooting
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  The clean corpus produced 0 matches among 542441 file events, but a control
  matching any certutil file write also produced 0: certutil file output is
  absent, so 0.0% is a null result. The eight-extension tier has its first lab
  positive at C:\lab\decoded-marker.dll, but approved deployment can still
  reconstruct scripts or binaries. Correlate the same ProcessGuid with the
  certutil decode process rule and enrich signer, path, size, and follow-on
  execution before actioning.
level: low
