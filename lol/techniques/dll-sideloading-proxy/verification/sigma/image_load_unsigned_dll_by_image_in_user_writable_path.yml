title: Unsigned DLL Loaded By Image In a User-Writable Path
id: 012b33f0-9e85-47f5-b550-21d83595a5ba
status: experimental
description: >-
  Detects an unsigned or untrusted DLL loaded by a process whose executable is
  also under a common user-writable root. The rule is independent of both the
  host executable name and DLL name, so it can surface sideloading against an
  application that is absent from per-DLL name lists.
references:
  - https://zerotracelab.com/blog/dll-sideloading-proxying
  - https://attack.mitre.org/techniques/T1574/001/
  - https://attack.mitre.org/techniques/T1574/002/
  - https://github.com/SigmaHQ/sigma/blob/8eaafff1f2845a696050e05e72ba1140ee190698/rules/windows/image_load/image_load_side_load_libvlc.yml
related:
  - id: bf9808c4-d24f-44a2-8398-b65227d406b6
    type: similar
author: Codex lab orchestrator
date: '2026-08-20'
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection_process_path:
    Image|startswith:
      - 'C:\ProgramData\'
      - 'C:\Users\'
      - 'C:\Windows\Temp\'
  selection_dll_path:
    ImageLoaded|startswith:
      - 'C:\ProgramData\'
      - 'C:\Users\'
      - 'C:\Windows\Temp\'
    ImageLoaded|endswith: '.dll'
  selection_unsigned:
    Signed: 'false'
  selection_untrusted:
    SignatureStatus:
      - 'Unavailable'
      - 'Invalid'
  condition: >-
    selection_process_path and selection_dll_path and
    (selection_unsigned or selection_untrusted)
falsepositives:
  - Legitimate portable applications, per-user installers, and self-updaters that load their own unsigned DLLs
  - Enterprise deployment, inventory, or support software operating from ProgramData
  - Software development, malware-analysis, and penetration-testing activity
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  Sysmon EID 7 signature fields describe the loaded DLL, not the loading
  executable. Sigma also cannot compare the Image and ImageLoaded directory
  fields, so this rule approximates "same directory" as "both paths are under
  common user-writable roots" and cannot prove that the host is signed. It has
  no exclusions and therefore no attacker-controlled filter off switch. Treat
  each match as a lead and correlate the process signature, exact directory
  equality, parent process, persistence, and network activity before escalation.
  A validly signed malicious DLL is out of scope by construction; correlate
  signer reputation and the upstream signed-DLL/no-metadata hunt for that form.
  The measured baseline count and denominator are recorded in verification.json.
level: low
