title: WMIC XSL Spawns a Command or Script Interpreter
id: ac2c0a8c-7e39-45b5-96a0-fc8481856380
status: experimental
description: >-
  Detects a command or script interpreter launched directly by WMIC when the
  WMIC parent command line uses /format with an XSL resource.
references:
  - https://attack.mitre.org/techniques/T1220/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1220
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\wmic.exe'
    ParentCommandLine|contains|windash: '/format:'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Custom legacy WMIC XSL reporting templates that intentionally launch an approved helper interpreter
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  Measured against the process-creation category and hit the HTTP, local,
  SMB, VBScript, and HTTPS stylesheet samples. The rule does not require an XSL
  extension because WMIC accepts differently named stylesheet resources. A
  custom legacy reporting stylesheet can legitimately launch a helper, but
  this proves an execution consequence rather than retrieval alone. Correlate
  with remote /format, cache/retrieval, or script-engine telemetry. Collection
  requires ParentCommandLine (present in Sysmon EID 1 but not ordinary
  Security 4688), so a 4688-only deployment is silent.
level: high
