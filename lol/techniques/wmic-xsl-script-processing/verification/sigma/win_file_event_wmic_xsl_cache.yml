title: WMIC Writes XSL Content Into Internet Cache
id: e329114d-ed5e-45bc-a4ae-85f4f8394159
status: experimental
description: >-
  Detects WMIC writing an XSL or XSLT file beneath the Windows Internet cache,
  a supporting endpoint signal for remote /format stylesheet processing.
references:
  - https://attack.mitre.org/techniques/T1220/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1220
logsource:
  category: file_event
  product: windows
detection:
  selection_image:
    Image|endswith: '\wmic.exe'
  selection_cache:
    TargetFilename|contains: '\INetCache\'
  selection_xsl:
    TargetFilename|endswith:
      - '.xsl'
      - '.xslt'
  condition: selection_image and selection_cache and selection_xsl
falsepositives:
  - Approved legacy WMIC reporting workflows that retrieve remote XSL or XSLT stylesheets into Internet cache
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  Measured against the file-event category after removing the dead
  service-qualified logsource. Approved legacy
  WMIC reporting that retrieves remote stylesheets can create the same cache
  artifact, though routine benign analogues are scarce. Correlate with a WMIC
  /format command, the matching XSL HTTP request, a shell child, or JScript
  registry telemetry. Local and SMB delivery create no Internet-cache event,
  and a stylesheet served under a non-XSL name evades the extension check.
level: high
