title: Potential Remote SquiblyTwo Technique Execution
id: 8d63dadf-b91b-4187-87b6-34a1114577ea
related:
  - id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
    type: similar
  - id: 05c36dd6-79d6-4a9a-97da-3db20298ab2d
    type: similar
status: experimental
description: >-
  Detects WMIC using /format with a remote URL or UNC resource. Logic adopted
  from SigmaHQ master at commit 3c0d35188942eb6a8c373e4f4973ac7e84116993.
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wmic_squiblytwo_bypass.yml
  - https://attack.mitre.org/techniques/T1220/
author: Markus Neis, Florian Roth, Swachchhanda Shrawan Poudel (Nextron Systems); precision enrichment by Codex lab orchestrator
date: '2019-01-16'
modified: '2026-08-15'
tags:
  - attack.stealth
  - attack.t1047
  - attack.t1220
  - attack.execution
  - attack.t1059.005
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_pe:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
    - Hashes|contains:
        - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
        - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
        - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
        - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
        - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cli:
    CommandLine|contains|windash: '/format:'
    CommandLine|contains:
      - '://'
      - '\\\\'
  condition: all of selection_*
falsepositives:
  - Approved legacy WMIC inventory or reporting with remote stylesheets
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  Measured against the process-creation category. The adopted upstream logic
  matched the HTTP, SMB/UNC, VBScript HTTP, and HTTPS lab flows but correctly
  did not match the local stylesheet. Legitimate legacy remote reporting is
  the principal residual false positive; correlate with a WMIC shell child,
  script-engine telemetry, or stylesheet retrieval.
level: high
