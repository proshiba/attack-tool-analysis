title: XSL Script Execution Via WMIC.EXE
id: 05c36dd6-79d6-4a9a-97da-3db20298ab2d
related:
  - id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
    type: similar
  - id: 8d63dadf-b91b-4187-87b6-34a1114577ea
    type: similar
status: experimental
description: >-
  Detects WMIC with the format flag loading a potentially scripted local XSL.
  Logic adopted from SigmaHQ master at commit
  3c0d35188942eb6a8c373e4f4973ac7e84116993, with the built-in format
  suppression narrowed after a measured filename-based evasion.
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wmic_xsl_script_processing.yml
  - https://attack.mitre.org/techniques/T1220/
author: Timur Zinniatullin, oscd.community, Swachchhanda Shrawan Poudel; precision enrichment and filter fix by Codex lab orchestrator
date: '2019-10-21'
modified: '2026-08-16'
tags:
  - attack.stealth
  - attack.t1047
  - attack.t1220
  - attack.execution
  - attack.t1059.005
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
    - Hashes|contains:
        - 'IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E'
        - 'IMPHASH=37777A96245A3C74EB217308F3546F4C'
        - 'IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206'
        - 'IMPHASH=B12619881D79C3ACADF45E752A58554A'
        - 'IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00'
  selection_cmd:
    CommandLine|contains|windash: '-format:'
  filter_main_known_format:
    CommandLine|endswith:
      - 'Format:List'
      - 'Format:htable'
      - 'Format:hform'
      - 'Format:table'
      - 'Format:mof'
      - 'Format:value'
      - 'Format:rawxml'
      - 'Format:xml'
      - 'Format:csv'
  filter_main_remote_operation:
    CommandLine|contains:
      - '://'
      - '\\\\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
  - Custom local WMIC reporting stylesheets not covered by the built-in format filters
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  Measured against the process-creation category. This adopted broad local
  rule covers arbitrary local paths and does not require an XSL extension, so
  approved custom reporting can match. The built-in suppression is limited to
  command lines ending in the actual format token; filenames such as list.xsl
  are not suppressed. Use as a hunt and promote only with a WMIC interpreter
  child, script-engine telemetry, or a user-writable-path constraint.
level: low
