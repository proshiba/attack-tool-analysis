title: WMIC Applies a Remote XSL Stylesheet
id: f3a647a8-90e5-42f9-a953-e5eea60c07a4
status: experimental
description: >-
  Detects the signed WMIC utility using /format with a remote XSL or XSLT URL,
  a characteristic XSL script-processing execution pattern.
references:
  - https://attack.mitre.org/techniques/T1220/
  - https://lolbas-project.github.io/lolbas/Binaries/Wmic/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1220
logsource:
  category: process_creation
  product: windows
detection:
  selection_identity_image:
    Image|endswith: '\wmic.exe'
  selection_identity_original:
    OriginalFileName: 'wmic.exe'
  selection_format:
    CommandLine|contains: '/format:'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  selection_xsl:
    CommandLine|contains:
      - '.xsl'
      - '.xslt'
  condition: 1 of selection_identity_* and selection_format and selection_url and selection_xsl
falsepositives:
  - Legacy administrative inventory or reporting that intentionally applies an approved remote XSL or XSLT stylesheet
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  The clean corpus produced 0 matches among 23695 process starts and the rule
  hit the verified attack sample. Approved legacy inventory or reporting can
  intentionally use remote /format stylesheets, but the combined command is
  otherwise highly specific. Correlate with XSL network/cache evidence, a shell
  child, or JScript-start registry telemetry.
level: high
