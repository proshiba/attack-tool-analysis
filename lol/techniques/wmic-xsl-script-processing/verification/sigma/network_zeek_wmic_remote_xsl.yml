title: XSL Retrieval With Legacy MSIE Trident User-Agent
id: 09524123-3892-4af2-b9c4-56dc6304ae58
status: experimental
description: >-
  Detects HTTP retrieval of an XSL or XSLT resource with the legacy MSIE 7.0
  and Trident User-Agent profile observed during WMIC /format processing.
references:
  - https://attack.mitre.org/techniques/T1220/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1220
logsource:
  category: http
  product: zeek
detection:
  selection_method:
    method: 'GET'
  selection_xsl:
    uri|contains:
      - '.xsl'
      - '.xslt'
  selection_user_agent:
    user_agent|contains|all:
      - 'MSIE 7.0'
      - 'Trident/7.0'
  condition: selection_method and selection_xsl and selection_user_agent
falsepositives:
  - Legacy enterprise reporting applications retrieving approved XSL resources through the Windows URL-moniker stack
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  This Zeek rule is not testable on the EVTX corpus. Legitimate legacy
  reporting applications can fetch ordinary XSL or XSLT assets with the same
  MSIE 7.0 and Trident/7.0 URL-moniker profile. Make the signal actionable by
  correlating the requester with WMIC /format execution, a WMIC shell child,
  or WMIC JScript-start registry telemetry. It is extension-dependent and
  cannot inspect the HTTPS flow, so endpoint correlation is required.
level: low
