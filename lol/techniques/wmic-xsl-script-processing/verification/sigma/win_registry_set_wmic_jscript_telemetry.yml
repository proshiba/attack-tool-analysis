title: WMIC Initializes JScript Engine Telemetry
id: 59a1805f-300b-458f-b23b-b8406a047e33
status: experimental
description: >-
  Detects WMIC setting the Windows Script JScript-start telemetry value. This
  deep Sysmon registry signal was observed during scripted XSL processing.
references:
  - https://attack.mitre.org/techniques/T1220/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1220
logsource:
  category: registry_set
  product: windows
  service: sysmon
detection:
  selection:
    Image|endswith: '\wmic.exe'
    TargetObject|endswith: '\Microsoft\Windows Script\Settings\Telemetry\wmic.exe\JScriptSetScriptStateStarted'
  condition: selection
falsepositives:
  - Approved legacy WMIC inventory or reporting workflows that apply XSL containing JScript
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  The clean corpus produced 0 matches among 1151508 registry-set events.
  Approved WMIC reporting with JScript-bearing XSL can create the value, but it
  records actual script-engine initialization and survives URL or extension
  changes. Correlate with a /format process, stylesheet retrieval/cache event,
  or WMIC shell child.
level: high
