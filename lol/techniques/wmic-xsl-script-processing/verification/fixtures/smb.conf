[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = Bad User
   bind interfaces only = yes
   interfaces = lo eth0
   smb ports = 445
   disable spoolss = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log file = /tmp/wmic-xsl-smb/log.%m
   pid directory = /tmp/wmic-xsl-smb
   lock directory = /tmp/wmic-xsl-smb
   state directory = /tmp/wmic-xsl-smb
   cache directory = /tmp/wmic-xsl-smb
   private dir = /tmp/wmic-xsl-smb/private

[wmicxsl]
   path = /tmp/wmic-xsl-share
   guest ok = yes
   guest only = yes
   read only = yes
   browseable = yes
