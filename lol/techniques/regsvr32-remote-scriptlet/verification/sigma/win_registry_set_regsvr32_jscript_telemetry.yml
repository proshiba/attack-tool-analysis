title: Regsvr32 Initializes JScript Engine Telemetry
id: b4c58a20-4ee8-419b-9ba1-8f7a6468db0e
status: experimental
description: >-
  Detects regsvr32 setting the Windows Script JScript-start telemetry value.
  This deep Sysmon registry signal was observed during remote SCT execution.
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1218.010
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    TargetObject|endswith: '\Microsoft\Windows Script\Settings\Telemetry\regsvr32.exe\JScriptSetScriptStateStarted'
  condition: selection
falsepositives:
  - Authorized deployment, compatibility testing, or registration workflows that execute JScript-based scriptlets through regsvr32
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  The PR #15-era zero was invalid because it was measured through the dead
  category+product+service mapping. After removing service, the corrected query
  produced 0 matches among 1151508 registry-set events; the positive corpus has
  no matching sample, so recall is not measured there. Authorized regsvr32
  JScript deployment or compatibility testing can create the value, but it
  records actual script-engine initialization rather than a command-line token.
  Correlate with a remote /i command, SCT retrieval, cache creation, or a shell
  child.
level: high
