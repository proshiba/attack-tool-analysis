title: Regsvr32 Spawns a Command or Script Interpreter
id: e72170bd-62ac-4864-8130-fbda87705a19
status: experimental
description: >-
  Detects a command or script interpreter launched by regsvr32. The verified
  remote SCT created cmd.exe as a direct child of regsvr32.exe.
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\regsvr32.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Installer or COM-registration packages that use regsvr32 and legitimately shell out to a helper interpreter
fp_likelihood: medium
recommended_role: alert
precision_notes: >-
  The clean corpus produced 0 matches among 23695 process starts and the rule
  hit the verified attack sample, but installer and COM-registration packages
  can occasionally make regsvr32 start a helper shell. Correlate with a remote
  /i scriptlet command, SCT network/cache evidence, or JScript-start telemetry.
level: high
