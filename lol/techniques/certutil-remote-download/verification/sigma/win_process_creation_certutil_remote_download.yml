title: Certutil Remote File Download
id: 6aaceadd-7bb2-4a77-a434-e2d42c55d210
status: experimental
description: >-
  Detects the Microsoft certutil binary with a documented remote-download
  verb and an HTTP or HTTPS indicator. This behavior can transfer a staged
  payload with a signed Windows utility.
references:
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
  - https://attack.mitre.org/techniques/T1105/
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_identity_image:
    Image|endswith: '\certutil.exe'
  selection_identity_original:
    OriginalFileName: 'CertUtil.exe'
  selection_download_verb:
    CommandLine|contains|windash:
      - '-urlcache '
      - '-verifyctl '
      - '-URL '
  selection_http:
    CommandLine|contains: 'http'
  condition: >-
    1 of selection_identity_* and selection_download_verb and selection_http
falsepositives:
  - PKI administrators fetching certificates, CRLs, CTLs, or trust material with certutil
  - Software deployment or troubleshooting workflows invoking documented certutil URL retrieval verbs
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  The broadened rule produced 0 matches among 23695 process starts and hit the
  attack corpus. That clean result is only a floor: the corpus has no benign
  certutil control activity. The earlier 0 of 23695 measurement described an
  overfit -split plus shell-parent rule and was not evidence of production
  precision. Legitimate PKI, enrollment, deployment, and troubleshooting
  retrievals can match. Prioritize an unusual destination or a newly written
  executable/script, especially execution of the written path.
level: medium
