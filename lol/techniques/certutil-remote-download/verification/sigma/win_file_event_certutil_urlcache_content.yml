title: Certutil Writes Cryptnet URL Cache Content
id: e44710d9-5a31-45ab-b949-12acdefc5713
status: experimental
description: >-
  Detects certutil writing a file into the CryptnetUrlCache content directory.
  This supporting endpoint signal was observed while certutil transferred a
  remote file with URL-cache download switches.
references:
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
  - https://attack.mitre.org/techniques/T1105/
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_image:
    Image|endswith: '\certutil.exe'
  selection_cache_content:
    TargetFilename|contains: '\Microsoft\CryptnetUrlCache\Content\'
  condition: selection_image and selection_cache_content
falsepositives:
  - Legitimate certutil retrieval of certificates, certificate trust lists, or certificate revocation lists
  - PKI enrollment or troubleshooting that refreshes the Cryptnet URL cache with certutil
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The clean corpus produced 0 matches among 542441 file events. The certutil
  image constraint excludes routine CryptSvc writes, but every legitimate
  certutil URL retrieval can still write here, including CRL, CTL,
  certificate-chain, enrollment, and PKI troubleshooting activity. Treat this
  as corroborating hunt telemetry, not a standalone alert; correlate it with
  the remote-download process rule, destination context, or a newly written
  executable or script.
level: low
