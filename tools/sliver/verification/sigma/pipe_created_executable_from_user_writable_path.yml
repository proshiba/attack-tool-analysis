title: Named Pipe Created by an Executable in a User-Writable Location
id: 6bc6a71e-80d1-4011-b84e-1a0c42953cde
status: experimental
description: >-
  Detects a named-pipe server created by an executable running from common
  user-writable or staging locations. Sliver supports operator-selected named
  pipes for pivot C2, so the rule keys on pipe-server behavior and image
  placement rather than a configurable pipe name. The verified HTTP-beacon
  flow produced no Sysmon EID 17 or 18 and therefore did not exercise this
  Tier 2 rule.
references:
  - https://github.com/BishopFox/sliver/wiki/Pivots
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.command_and_control
  - attack.t1572
logsource:
  category: pipe_created
  product: windows
  service: sysmon
detection:
  selection_pipe:
    PipeName|startswith: '\'
  selection_writable_image:
    Image|contains:
      - '\Users\Public\'
      - '\AppData\'
      - '\Downloads\'
      - '\Desktop\'
      - '\ProgramData\'
      - '\Windows\Temp\'
      - '\Temp\'
      - '\PerfLogs\'
  condition: selection_pipe and selection_writable_image
falsepositives:
  - User-installed applications and developer tools that implement named-pipe IPC
  - Installers or update agents temporarily running from writable directories
  - Authorized penetration tests and malware-analysis labs
level: medium
