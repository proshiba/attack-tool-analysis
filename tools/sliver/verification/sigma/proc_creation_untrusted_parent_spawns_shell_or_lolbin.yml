title: Executable Parent Outside Common Operator Hosts Spawns a Shell or LOLBin
id: 12e5c200-3bc3-407b-9bf7-412a8a32a104
status: experimental
description: >-
  Detects a generic executable spawning a command shell, script host, or
  frequently abused Windows utility while excluding common interactive,
  management, service, and installer parents. The verified Sliver beacon
  directly spawned cmd.exe for execute tasks. The parent name and hash are not
  fixed, so a renamed implant remains in scope.
references:
  - https://github.com/BishopFox/sliver
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  selection_parent:
    ParentImage|endswith: '.exe'
  filter_common_parents:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wmiprvse.exe'
      - '\wsmprovhost.exe'
      - '\winrs.exe'
      - '\services.exe'
      - '\psexesvc.exe'
      - '\taskeng.exe'
      - '\taskhostw.exe'
      - '\msiexec.exe'
      - '\setup.exe'
  condition: selection_child and selection_parent and not filter_common_parents
falsepositives:
  - Line-of-business applications that legitimately invoke shells or helper utilities
  - Updaters, build systems, and endpoint-management agents not covered by the filter
  - Authorized penetration tests and malware-analysis labs
level: medium
