title: Default Go Crypto TLS 1.3 JA3 and Minimal Server JA3S Pair in Suricata
id: 9a6daa77-1974-4655-96e6-afbd23ab2042
status: experimental
description: >-
  Detects the default Go crypto/tls client fingerprint paired with a minimal
  TLS 1.3 ServerHello. Sliver v1.7.3 Windows mTLS and Linux HTTPS/mTLS produced
  this pair, but it is a Go-runtime signal, not a Sliver identifier or a
  transport discriminator. It contains no lab address, port, hostname, or
  implant name. Use only as a hunt pivot with endpoint and flow-shape context.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
  - https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
author: Codex lab orchestrator
date: '2026-08-09'
modified: '2026-08-10'
tags:
  - attack.command-and-control
  - attack.t1573.002
logsource:
  category: tls
  product: suricata
detection:
  selection_fingerprint:
    tls.ja3.hash: 2196848d251b217de8b2c037e356c11d
    tls.ja3s.hash: f4febc55ea12b31ae17cfb7e614afda8
  condition: selection_fingerprint
falsepositives:
  - Internal Go clients talking to Go TLS 1.3 services with the same generic crypto/tls fingerprint pair
  - Authorized Sliver red-team infrastructure and malware-analysis labs
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  This Suricata rule is not testable on the EVTX corpus. The JA3/JA3S pair is a
  Go-runtime fingerprint rather than a Sliver artefact. Treat this rule as a
  correlation lead, not a standalone alert. It matched all 15 Linux HTTPS
  flows and the one Linux mTLS session. Ordinary Go clients and TLS 1.3 servers
  can match continuously. The five-in-75-seconds and 9-14-second cadence is
  calibrated only to this lab's configured 10+0-3 second beacon and must be
  parameterized for a production interval. Correlate session-mode mTLS with
  long flow duration and unusual endpoint execution. Go version changes can
  invalidate the hash.
level: low
