title: Sliver TLS JA3 and JA3S Pair in Suricata TLS Events
id: 9a6daa77-1974-4655-96e6-afbd23ab2042
status: experimental
description: >-
  Detects the client/server TLS fingerprint pair observed by Suricata for the
  official Sliver v1.7.3 Windows mTLS and Linux HTTPS/mTLS implants. The Linux
  HTTPS and mTLS transports produced the same pair, so this rule intentionally
  does not claim transport discrimination. It contains no lab address, port,
  hostname, or implant name. Correlate five matches between the same endpoints
  in 75 seconds to model HTTPS beacon timing.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
  - https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
author: Codex lab orchestrator
date: '2026-08-09'
modified: '2026-08-10'
tags:
  - attack.command-and-control
  - attack.t1573.002
logsource:
  category: tls
  product: suricata
detection:
  selection_fingerprint:
    tls.ja3.hash: 2196848d251b217de8b2c037e356c11d
    tls.ja3s.hash: f4febc55ea12b31ae17cfb7e614afda8
  condition: selection_fingerprint
falsepositives:
  - Internal Go clients talking to Go TLS 1.3 services with the same generic crypto/tls fingerprint pair
  - Authorized Sliver red-team infrastructure and malware-analysis labs
fp_likelihood: medium
recommended_role: alert
precision_notes: >-
  This Suricata rule is not testable on the EVTX corpus. It matched all 15 Linux
  HTTPS flows and the one Linux mTLS session. The pair can represent non-Sliver
  Go TLS peers and is pinned to this Sliver/Go profile. Correlate repeated HTTPS
  matches with 9-14 second gaps; correlate session-mode mTLS with long flow
  duration and unusual Linux execution.
level: high
