title: Sliver mTLS JA3 and JA3S Pair in Zeek TLS Logs
id: b0787147-05b5-425d-a623-17a94c107e03
status: experimental
description: >-
  Detects the client/server TLS fingerprint pair observed for the official
  Sliver v1.7.3 Windows amd64 mTLS beacon. It does not key on an address, port,
  hostname, SNI, implant name, or certificate. Fingerprints can change with
  Sliver or Go TLS versions; correlate repeated matches by origin and responder
  over a rolling window to identify beacon periodicity.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
  - https://github.com/salesforce/ja3
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.command_and_control
  - attack.t1573.002
logsource:
  category: tls
  product: zeek
detection:
  selection_fingerprint:
    ja3: 2196848d251b217de8b2c037e356c11d
    ja3s: f4febc55ea12b31ae17cfb7e614afda8
  condition: selection_fingerprint
falsepositives:
  - Other Go applications built with the same TLS stack and cipher profile
  - Authorized Sliver red-team infrastructure and malware-analysis labs
level: high
