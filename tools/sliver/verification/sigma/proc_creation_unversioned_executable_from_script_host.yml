title: Unversioned Executable Launched by a Script or Command Host
id: a06799a0-3ca8-43a8-a219-9b40db75dbe3
status: experimental
description: >-
  Detects an executable with absent PE identity metadata launched by a script
  or command host. The verified generated Sliver implant had no company,
  product, or original filename metadata and was started by PowerShell. The
  rule is behavioral and does not depend on the generated implant name, path,
  or hash.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_executable:
    Image|endswith: '.exe'
    Company: '-'
    Product: '-'
    OriginalFileName: '-'
  selection_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_executable and selection_parent
falsepositives:
  - Internally compiled Go, Rust, or C/C++ utilities without version resources
  - Software installers and administrator tooling launched from deployment scripts
  - Authorized penetration tests and malware-analysis labs
level: medium
