title: Repeated TLS 1.3 Without SNI or a Passively Visible Certificate Chain
id: 4d06d96e-ce11-474c-a9b5-f061d311a78d
status: experimental
description: >-
  Identifies established TLS 1.3 connections with no SNI and no passively
  visible certificate chain in Zeek ASCII TSV ssl.log output. This matched 15
  Linux HTTPS rows and one Linux mTLS row in the retained sanitized counts.
  Treat this as a hunt signal and aggregate repeated matches; certificate
  visibility varies by protocol, sensor, and TLS implementation.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
  - https://docs.zeek.org/en/current/logs/ssl.html
author: Codex lab orchestrator
date: '2026-08-09'
modified: '2026-08-10'
tags:
  - attack.command-and-control
  - attack.t1573.002
logsource:
  category: tls
  product: zeek
detection:
  selection_tls:
    version: TLSv13
    established: 'T'
    resumed: 'F'
    server_name: '-'
    cert_chain_fps: '-'
  condition: selection_tls
falsepositives:
  - Legitimate non-browser mTLS and service-to-service TLS without SNI
  - TLS 1.3 sessions for which certificate telemetry is unavailable to Zeek
  - Network devices and embedded software using literal-IP TLS endpoints
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  This Zeek ASCII-TSV rule is not testable on the EVTX corpus. Legitimate
  service-to-service mTLS, appliance literal-IP TLS, and any TLS 1.3 session
  whose certificate is not visible to the sensor can match, making it a broad
  hunt pivot. JSON Zeek exports omit absent optional fields and require a
  backend-native field-absence translation instead. Require repeated timing
  plus endpoint context before escalation.
level: low
