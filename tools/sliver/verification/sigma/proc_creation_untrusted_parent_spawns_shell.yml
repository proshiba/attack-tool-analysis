title: Unrecognized Executable Parent Spawns a Shell or Script Utility
id: 726f2e47-becc-4b98-89d0-cfb67d0fa19d
status: experimental
description: >-
  Detects a generic executable parent spawning a command shell or common
  script/LOLBin child while excluding frequent Windows and management parents.
  The verified Sliver execute task directly spawned cmd.exe from the generated
  implant. Correlate with an unversioned parent, unusual path, or network C2.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  selection_parent:
    ParentImage|endswith: '.exe'
  filter_common_parents:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\explorer.exe'
      - '\services.exe'
      - '\svchost.exe'
      - '\wmiprvse.exe'
      - '\wsmprovhost.exe'
      - '\winrs.exe'
      - '\taskeng.exe'
      - '\taskhostw.exe'
      - '\msiexec.exe'
      - '\psexesvc.exe'
  condition: selection_child and selection_parent and not filter_common_parents
falsepositives:
  - VS Code, Dropbox, PeaZip, and other user applications that legitimately invoke shells or helpers
  - Firefox and print-component installers, setup.exe, iissetup.exe, and other installers spawning regsvr32
  - Build systems and endpoint-management agents not present in the finite parent filter
  - Authorized penetration tests and malware-analysis labs
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  The clean corpus produced 321 matches, 1.354716% of all 23695 process starts.
  Benign parents included VS Code (56), Dropbox (29), setup.exe (27), PeaZip
  (10), and iissetup.exe (9), plus 106 regsvr32 children from ordinary Firefox
  and print-software installation. This is actionable only with an unsigned or
  unversioned parent, unusual path, and an external beacon or matching JA3 pair.
level: low
