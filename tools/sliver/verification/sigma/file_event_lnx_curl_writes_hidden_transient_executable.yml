title: Curl Writes a Hidden File in a Linux Transient Directory
id: 031877dc-97db-4ae8-83fe-578d5d5afed5
status: experimental
description: >-
  Detects curl writing a hidden payload under a transient Linux directory. All
  three verified Sliver deliveries produced this auditd-correlated file event
  before chmod and execution. SigmaHQ master has an equivalent file-event rule
  for wget but not curl. This rule is independent of the payload name, hash,
  C2 address, and port; correlate with execution of the written object.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_wget_download_file_in_tmp_dir.yml
author: Codex lab orchestrator
date: '2026-08-10'
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: file_event
  product: linux
detection:
  selection_writer:
    Image|endswith: '/curl'
  selection_transient:
    TargetFilename|startswith:
      - '/tmp/.'
      - '/var/tmp/.'
      - '/dev/shm/.'
  condition: selection_writer and selection_transient
falsepositives:
  - Bootstrap and update scripts that intentionally download hidden temporary files
  - Package-management or configuration-management jobs using curl as a fetcher
  - Authorized penetration tests and malware-analysis labs
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  Linux auditd/Sysmon telemetry is not testable on the Windows EVTX corpus. The
  rule matched one event in each of the three verification flows, but the
  behavior is not Sliver-specific. Require a subsequent chmod/exec of the same
  object plus an unusual network profile or TLS fingerprint before escalation.
level: low
