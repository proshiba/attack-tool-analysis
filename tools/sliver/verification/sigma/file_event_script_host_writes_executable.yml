title: Script or Command Host Writes a Windows Executable Payload
id: 7d9d5a22-664d-4457-891c-195fb2b4ca6b
status: experimental
description: >-
  Detects script-oriented Windows utilities writing executable payloads. The
  verified out-of-band Sliver delivery was reassembled by PowerShell and
  produced an observed executable file event before launch. The rule is
  independent of the generated implant name, hash, and lab directory.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_writer:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  selection_payload:
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.sys'
      - '.scr'
      - '.cpl'
  condition: selection_writer and selection_payload
falsepositives:
  - Software deployment and packaging scripts
  - Administrator bootstrap scripts that write approved binaries
  - Authorized penetration tests and malware-analysis labs
level: medium
