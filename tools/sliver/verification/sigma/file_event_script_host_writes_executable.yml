title: Script or Command Host Writes a Windows Executable Payload
id: 7d9d5a22-664d-4457-891c-195fb2b4ca6b
status: experimental
description: >-
  Detects script-oriented Windows utilities writing executable payloads. The
  verified out-of-band Sliver delivery was reassembled by PowerShell and
  produced an observed executable file event before launch. The rule is
  independent of the generated implant name, hash, and lab directory.
references:
  - https://github.com/BishopFox/sliver/releases/tag/v1.7.3
author: Codex lab orchestrator
date: '2026-08-09'
modified: '2026-08-12'
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_writer:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  selection_payload:
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.sys'
      - '.scr'
      - '.cpl'
  condition: selection_writer and selection_payload
falsepositives:
  - PowerShell module and assembly deployment that writes DLL or EXE files
  - Package managers, software deployment, bootstrap scripts, and installer extraction
  - Authorized penetration tests and malware-analysis labs
fp_likelihood: high
recommended_role: hunt
precision_notes: >-
  Positive provenance was re-grounded by commit
  140489472f7bfba90fbaaf9b4e67c844cf3edf71 and the unfiltered 2026-08-11
  Windows capture SHA-256
  8d8654fc494e4585301b56f58feb23153a01a6257c2cd3437b96ad5f5528a773:
  PowerShell wrote both renamed implants and the inert faultrep.dll, without
  any implant-name predicate in this rule.
  The clean corpus produced 64 matches, 0.011799% of 542441 file events; all 64
  were powershell.exe writing a DLL or EXE during benign module, assembly, or
  software deployment. Package managers, bootstrap scripts, and installers
  produce the same broad behavior. Act only with an unusual destination or
  unsigned image plus execution and an external beacon or matching JA3 pair.
level: low
