title: Unversioned Executable Launched by a Script Host Before Web Beaconing
id: 2ae231a5-b5ec-444f-ae6e-8a1ac281bf59
status: experimental
description: >-
  Detects an executable with absent PE identity metadata launched by a script
  or command host. Both renamed AdaptixC2 agents in this run produced this
  filename-independent delivery and execution pattern.
references:
  - https://www.group-ib.com/blog/jadeprox-china-nexus-triback-loader/
  - https://github.com/Adaptix-Framework/AdaptixC2
author: Codex lab orchestrator
date: '2026-08-11'
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_executable:
    Image|endswith: '.exe'
    Company: '-'
    Product: '-'
    OriginalFileName: '-'
  selection_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_executable and selection_parent
falsepositives:
  - Internally built Go, Rust, or C/C++ utilities without version resources
  - Software deployment, package-management, and administrator scripts launching unversioned tools
  - Authorized adversary-emulation and malware-analysis labs
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The clean-corpus floor will be recorded by the audit gate. This generic
  pattern previously matched ordinary software-management commands in the
  repository corpus, so it remains a hunt. Correlate with a user-writable or
  unusual path, a preceding executable write, and the HTTP profile or repeated
  TLS flow. The rule contains no generated agent filename or callback value.
level: medium
