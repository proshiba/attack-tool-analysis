title: Adaptix-Style DNS C2 Query Structure in Zeek
id: 004fe568-d0a0-498b-ab53-1d8bdaebc0c3
status: experimental
description: >-
  Detects the address- and parent-domain-independent DNS query structure used
  by the reviewed Adaptix Beacon DNS client: an eight-hex session identifier,
  operation label, two eight-hex fields, and one or more Base32 data labels.
  Correlate at least five matches by originator and terminal parent domain in a
  deployment-specific rolling window to distinguish a C2 sequence from one
  isolated query.
references:
  - https://github.com/Adaptix-Framework/AdaptixC2/tree/v1.2
  - https://docs.zeek.org/en/current/logs/dns.html
author: Codex lab orchestrator
date: '2026-08-12'
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: dns
  product: zeek
detection:
  selection_type:
    qtype_name:
      - A
      - AAAA
      - TXT
  selection_shape:
    query|re: '^[0-9a-f]{8}\.(?:www|hi|cdn|put|api|get|hb)\.[0-9a-f]{8}\.[0-9a-f]{8}\.(?:[a-z2-7]{20,63}\.)+'
  condition: selection_type and selection_shape
falsepositives:
  - DNS tunneling or application protocols independently using the same session, operation, sequence, index, and Base32-label structure
  - Authorized red-team and malware-analysis traffic
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  Zeek DNS logs are not testable on the Windows EVTX corpus. The rule matched
  all 12 resolver-duplicated query rows from five source-faithful heartbeat
  probes and none of the four short control rows or ten earlier permissive-
  parser probes. No Linux DNS agent exists in the reviewed release, so this is
  source-plus-listener validation rather than observed implant traffic, and
  the two-second probe spacing is not an agent cadence measurement. The Sliver
  rule requires multiple maximum-length restricted-alphabet labels and matched
  none of these rows; both families use Base32-like multi-label DNS, but the
  captured structures are not interchangeable. Because the positive traffic
  was generated from the same source reading that produced this expression,
  retain it as a hunt until genuine implant traffic independently validates
  the shape and the recommended five-query correlation.
level: medium
