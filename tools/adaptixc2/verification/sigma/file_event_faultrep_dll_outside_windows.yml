title: Faultrep DLL Written Outside Windows Directories
id: a2b6bc74-03b9-4e52-8807-1906448166d7
status: experimental
description: >-
  Detects creation of faultrep.dll outside normal Windows directories. The
  verified inert sideload used this technique-specific name beside a valid
  Microsoft-signed copy of WerFault.exe.
references:
  - https://hijacklibs.net/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_side_load_from_non_system_location.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_werfault_dll_hijacking.yml
related:
  - id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
    type: derived
author: Codex lab orchestrator
date: '2026-08-11'
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection_name:
    TargetFilename|endswith: '\faultrep.dll'
  filter_main_windows:
    TargetFilename|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - 'C:\Windows\WinSxS\'
      - 'C:\Windows\SoftwareDistribution\'
      - 'C:\Windows\UUS\'
      - 'C:\Windows\servicing\'
      - 'C:\$WINDOWS.~BT\'
  filter_main_windows_update:
    Image|endswith: '\wuaucltcore.exe'
  condition: selection_name and not 1 of filter_main_*
falsepositives:
  - Legacy crash-reporting software packaging faultrep.dll outside Windows directories
  - Software installers or forensic collections that copy the system DLL by name
  - Authorized DLL sideload testing and malware-analysis labs
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The verification produced one matching Sysmon file event before the signed
  host ran. Correlate with WerFault.exe executing from the same non-system
  directory, an unsigned DLL signature, and file creation by a downloader or
  script host. The technique-specific DLL name is intentionally used here; no
  AdaptixC2 agent filename, hash, lab path, or callback address is present.
  Where Sysmon EID 7 is enabled, upstream rule 4fc0deee already detects a
  non-system faultrep.dll image load and is the stronger control; this file-event
  rule is the fallback for EID-7-disabled environments. Faultrep.dll was the
  lab-chosen signed-host pair, not a DLL name attributed to JadeProx or Dragon
  Weave.
level: medium
