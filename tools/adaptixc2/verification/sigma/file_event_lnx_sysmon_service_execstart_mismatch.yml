title: Sysmon Service Unit ExecStart Mismatch
id: e2ccc99a-c175-42e7-a304-8e924281bc03
status: experimental
description: >-
  Detects a systemd unit named sysmon.service whose parsed ExecStart does not
  launch a known Sysmon for Linux binary. The rule keys on the mismatch between
  a security-component identity and its implementation, not on the substituted
  executable name, hash, callback address, or port. Deployments must enrich
  file-integrity events with unit content as FileContent.
references:
  - https://censys.com/blog/adaptixc2-open-source-c2-framework/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_systemd_service_creation.yml
author: Codex lab orchestrator
date: '2026-08-12'
tags:
  - attack.persistence
  - attack.t1543.002
  - attack.defense-evasion
  - attack.t1036
logsource:
  category: file_event
  product: linux
detection:
  selection_unit:
    TargetFilename|endswith: '/sysmon.service'
  selection_execstart:
    FileContent|contains: 'ExecStart='
  filter_known_sysmon:
    FileContent|contains:
      - 'ExecStart=/opt/sysmon/sysmon '
      - 'ExecStart=/usr/bin/sysmon '
      - 'ExecStart=/usr/local/bin/sysmon '
  condition: selection_unit and selection_execstart and not filter_known_sysmon
falsepositives:
  - Locally packaged or wrapper-based Sysmon deployments using a different reviewed binary path
  - Authorized security-product migrations before the unit and package inventory are updated
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  Linux file/content telemetry is not testable on the Windows EVTX corpus. In
  this run, auditd recorded one creation of /etc/systemd/system/sysmon.service
  and the retained unit content showed ExecStart in a hidden, non-package-owned
  path; the baseline unit launched /opt/sysmon/sysmon with the installed XML.
  The content mismatch therefore matched once by cross-source correlation.
  Raw auditd PATH alone does not contain ExecStart, so a backend without unit
  content enrichment cannot evaluate this rule. Package ownership and signer
  or provenance checks should raise confidence but are not portable Sigma
  fields.
level: high
