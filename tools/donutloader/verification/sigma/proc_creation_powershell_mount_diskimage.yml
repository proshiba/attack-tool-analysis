title: PowerShell Mount-DiskImage Invocation
id: a270163b-2d0a-4a9c-81f8-3642fe2b8512
status: experimental
description: >-
  Detects PowerShell invoking Mount-DiskImage with an explicit image path. The
  verified delivery used this form, while Script Block Logging produced no EID
  4104 in the run; process creation remained available.
references:
  - https://x.com/bomccss/status/2077318455716679970
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_susp_mount_diskimage.yml
related:
  - id: 29e1c216-6408-489d-8a06-ee9d151ef819
    type: derived
author: Codex lab orchestrator
date: '2026-08-16'
tags:
  - attack.t1553.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cmdlet:
    CommandLine|contains: 'Mount-DiskImage'
  selection_image_path:
    CommandLine|contains|windash: '-ImagePath'
  condition: all of selection_*
falsepositives:
  - Administrators, software deployment systems, and help-desk tooling mounting legitimate disk images
  - Software installation and virtual-media workflows
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The evtx-baseline v0.8.4 corpus produced 0 matches among 23695 process starts
  (0.0%). The declared medium likelihood is a qualitative raise for legitimate
  administrative mounting. This process-telemetry fallback has no exclusions;
  correlate with image download and execution from the mounted drive.
level: low
