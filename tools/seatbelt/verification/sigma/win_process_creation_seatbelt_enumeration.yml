title: Seatbelt-Style Host Enumeration Arguments
id: 8f05c2f4-e6ae-4b43-98c1-63ce4b8a90d2
status: experimental
description: >-
  Detects the invariant Seatbelt -group= argument syntax or multiple distinctive
  Seatbelt check names in one process command line. The rule does not depend on
  image or original filename and therefore survives executable renaming. A
  renamed run of only one innocuous check is intentionally difficult to detect.
references:
  - https://github.com/GhostPack/Seatbelt
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1518.001
  - attack.t1087.001
  - attack.t1012
  - attack.t1057
  - attack.t1033
  - attack.t1016
logsource:
  category: process_creation
  product: windows
detection:
  selection_group:
    CommandLine|contains: ' -group='
  selection_check_windows_vault:
    CommandLine|contains: 'WindowsVault'
  selection_check_cloud_credentials:
    CommandLine|contains: 'CloudCredentials'
  selection_check_laps:
    CommandLine|contains: 'LAPS'
  selection_check_amsi_providers:
    CommandLine|contains: 'AMSIProviders'
  selection_check_rdp_saved_connections:
    CommandLine|contains: 'RDPSavedConnections'
  selection_check_windows_credential_files:
    CommandLine|contains: 'WindowsCredentialFiles'
  selection_check_dpapi_master_keys:
    CommandLine|contains: 'DpapiMasterKeys'
  condition: selection_group or 2 of selection_check_*
falsepositives:
  - Authorized red-team, penetration-test, or incident-response use of Seatbelt
  - Inventory or audit tooling that independently uses -group= syntax or combines several listed check names
  - A renamed Seatbelt run with only one innocuous check is not covered by design to avoid noisy single-token matches
level: high
