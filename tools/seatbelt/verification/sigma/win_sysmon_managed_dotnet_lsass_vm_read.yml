title: Managed .NET Process Access to LSASS With VM Read Rights
id: b159f0a6-e39d-4d93-82bf-e2ee71a1b2ca
status: experimental
description: >-
  Detects a managed .NET process opening LSASS with an access mask that includes
  PROCESS_VM_READ. Seatbelt produced this rename-resilient Sysmon signal while
  enumerating interesting processes during a broad host survey.
references:
  - https://github.com/GhostPack/Seatbelt
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess: '0x1410'
  selection_managed_calltrace:
    CallTrace|contains|all:
      - '\assembly\NativeImages_'
      - '\System.ni.dll'
  condition: selection_target and selection_access and selection_managed_calltrace
falsepositives:
  - Managed endpoint-security, identity-protection, EDR, or inventory agents inspecting LSASS through .NET Framework
  - Authorized managed diagnostic or process-inventory utilities using access 0x1410
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The PR #15-era zero was invalid because it was measured through the dead
  category+product+service mapping. After removing service, the corrected query
  produced 0 matches among 1619360 process-access events; the positive corpus
  has no matching sample, so recall is not measured there. Only 7637 baseline
  events targeted LSASS. Managed EDR, identity, inventory, and diagnostic agents
  can produce the same 0x1410 plus .NET Framework CallTrace. Make it actionable
  with Seatbelt-style -group or multi-check syntax, an unsigned unusual source
  image, or correlated discovery activity.
level: medium
