title: Mimikatz Named Windows Prefetch Artifact
id: 99599996-3616-410e-bc3c-f1143414fdc4
status: experimental
description: >-
  Detects creation, replacement, or deletion telemetry for a Windows Prefetch
  file whose executable basename is MIMIKATZ.EXE. Windows, rather than the
  mimikatz process, wrote the artifact in the verified run. This is a
  name-dependent secondary signal and will not survive executable renaming.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: file_event
  product: windows
detection:
  selection_path:
    TargetFilename|contains: '\Windows\Prefetch\MIMIKATZ.EXE-'
    TargetFilename|endswith: '.pf'
  condition: selection_path
falsepositives:
  - Authorized penetration tests, red-team exercises, and malware-analysis labs
  - Forensic handling of a Prefetch artifact under its original path and name
level: medium
