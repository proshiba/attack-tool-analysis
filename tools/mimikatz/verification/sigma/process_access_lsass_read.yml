title: Process Access to LSASS with a Memory Read Access Mask
id: caf6daf0-615c-46f2-ba61-a8bb927605a6
status: experimental
description: >-
  Detects a process launched from a user-writable staging root opening LSASS
  with the verified PROCESS_VM_READ access mask. The rule accepts the hex form
  emitted by the lab sensor and the decimal form used by the audit corpus.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection_source:
    SourceImage|startswith:
      - 'C:\ProgramData\'
      - 'C:\Users\'
      - 'C:\Windows\Temp\'
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess:
      - '0x1010'
      - '4112'
  condition: all of selection_*
falsepositives:
  - Antivirus, EDR, identity-protection, backup, and inventory agents installed or unpacked under a writable root
  - Authorized security testing and malware-analysis activity
fp_likelihood: medium
recommended_role: hunt
precision_notes: >-
  The evtx-baseline v0.8.4 corpus produced 0 matches among 1619360
  process-access events (0.0%), and the public positive corpus matched. Medium
  is a qualitative raise for security or support tools unpacked under writable
  roots. The rule has no exclusions; correlate with CLR activation, an
  in-memory call trace, injection, or dump-file creation.
level: medium
