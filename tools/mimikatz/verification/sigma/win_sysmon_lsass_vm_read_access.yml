title: Process Access to LSASS with a Memory Read Access Mask
id: caf6daf0-615c-46f2-ba61-a8bb927605a6
status: experimental
description: >-
  Detects a process opening LSASS with an access mask that includes memory-read
  rights. This behavior was verified with mimikatz sekurlsa::logonpasswords and
  is characteristic of LSASS credential dumping regardless of the source image
  name, path, or hash.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
  service: sysmon
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  condition: selection_target and selection_access
falsepositives:
  - Endpoint security, identity protection, and EDR products inspecting LSASS
  - Authorized debuggers, crash dump utilities, and administrator diagnostics
level: high
