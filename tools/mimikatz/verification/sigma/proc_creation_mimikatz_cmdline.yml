title: Mimikatz Module Command Syntax in a Process Command Line
id: 09b3358d-4a11-43d2-a8d4-f8c6a4202bf8
status: experimental
description: >-
  Detects characteristic mimikatz module::command syntax in any process command
  line. These tokens survive executable renaming. Parent process context can
  refine triage but is deliberately not required. The verified invocation used
  privilege::debug and sekurlsa::logonpasswords from PowerShell.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_command:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'kerberos::'
      - 'crypto::'
      - 'token::'
      - 'vault::'
      - 'sekurlsa::logonpasswords'
      - 'lsadump::dcsync'
  condition: selection_command
falsepositives:
  - Authorized penetration tests, red-team exercises, and malware-analysis labs
  - Build or CI command lines and security-test data containing generic C++ scope tokens such as crypto::, token::, vault::, or kerberos::
fp_likelihood: low
recommended_role: alert
precision_notes: >-
  The clean corpus produced 0 matches among 23695 process starts; the positive
  corpus has no mimikatz command line, so its no-hit result is not negative
  evidence. The short crypto::, token::, vault::, and kerberos:: tokens can
  occur in build/CI commands or security test data. Prioritize sekurlsa:: or
  lsadump:: matches plus LSASS access, an unsigned image, or credential-dumping
  follow-on activity.
level: high
