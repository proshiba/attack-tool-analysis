title: Mimikatz Credential Module Command Line from an Operator Process
id: 09b3358d-4a11-43d2-a8d4-f8c6a4202bf8
status: experimental
description: >-
  Detects a process with the original mimikatz filename or characteristic
  mimikatz double-colon credential-module commands when launched from common
  interactive, remote-management, service, or task parents. The verified
  invocation used privilege::debug and sekurlsa::logonpasswords from
  PowerShell.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_identity:
    OriginalFileName: mimikatz.exe
  selection_command:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'privilege::debug'
      - 'sekurlsa::'
      - 'lsadump::'
  selection_parent:
    ParentImage|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wmiprvse.exe'
      - '\wsmprovhost.exe'
      - '\winrs.exe'
      - '\services.exe'
      - '\psexesvc.exe'
      - '\taskeng.exe'
      - '\taskhostw.exe'
      - '\explorer.exe'
  condition: (selection_identity or selection_command) and selection_parent
falsepositives:
  - Authorized penetration tests, red-team exercises, and malware-analysis labs
  - Administrator scripts that reuse mimikatz-style module tokens as test data
level: high
