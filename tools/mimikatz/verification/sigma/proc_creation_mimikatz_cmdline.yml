title: Mimikatz Module Command Syntax in a Process Command Line
id: 09b3358d-4a11-43d2-a8d4-f8c6a4202bf8
status: experimental
description: >-
  Detects characteristic mimikatz module::command syntax in any process command
  line. These tokens survive executable renaming. Parent process context can
  refine triage but is deliberately not required. The verified invocation used
  privilege::debug and sekurlsa::logonpasswords from PowerShell.
references:
  - https://github.com/gentilkiwi/mimikatz
author: Codex lab orchestrator
date: '2026-08-09'
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_command:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'kerberos::'
      - 'crypto::'
      - 'token::'
      - 'vault::'
      - 'sekurlsa::logonpasswords'
      - 'lsadump::dcsync'
  condition: selection_command
falsepositives:
  - Authorized penetration tests, red-team exercises, and malware-analysis labs
  - Administrator scripts that reuse mimikatz-style module tokens as test data
level: high
